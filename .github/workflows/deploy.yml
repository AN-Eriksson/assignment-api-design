name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  newman-tests:
    name: API Tests (Newman)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm i -g newman

      - name: Create .env file
        run: |
          echo "POSTGRES_DB=${{ vars.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ vars.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "APP_JWT_SECRET=${{ secrets.APP_JWT_SECRET }}" >> .env
          echo "SERVER_PORT=${{ vars.SERVER_PORT }}" >> .env

      - name: Start stack for tests
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: docker compose up -d --build

      - name: Wait for API and seed
        run: |
          for i in {1..60}; do
            response=$(curl -fsS "http://localhost:${SERVER_PORT}/locations?page=0&size=1" || echo "")
            count=$(echo "$response" | grep -c '"id"')
            if [ "$count" -gt 0 ]; then
              echo "Seed complete!"
              exit 0
            fi
            echo "Waiting for seed..."
            sleep 10
          done
          docker compose logs app
          exit 1
        env:
          SERVER_PORT: ${{ vars.SERVER_PORT }}

      - name: Print app logs on failure
        if: failure()
        run: docker compose logs app

      - name: Run Newman
        run: newman run postman/ufoapi.postman_collection.json -e postman/ci.postman_environment.json

      - name: Teardown
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: newman-tests
    if: github.ref == 'refs/heads/main'
    env:
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_HOST_USER: ${{ vars.PRODUCTION_HOST_USER }}
      PRODUCTION_HOST_PATH: ${{ vars.PRODUCTION_HOST_PATH }}
      SERVER_PORT: ${{ vars.SERVER_PORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $PRODUCTION_HOST >> ~/.ssh/known_hosts

      - name: Pull latest code on server
        run: ssh -o StrictHostKeyChecking=no $PRODUCTION_HOST_USER@$PRODUCTION_HOST "cd $PRODUCTION_HOST_PATH && git pull origin main"

      - name: Deploy using Docker Compose
        run: |
          ssh $PRODUCTION_HOST_USER@$PRODUCTION_HOST "
            cd $PRODUCTION_HOST_PATH && \
            SERVER_PORT='${{ vars.SERVER_PORT }}' \
            docker compose up --build -d
          "